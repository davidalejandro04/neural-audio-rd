[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-audio-rd"
version = "0.1.0"
description = "Reproducible experiments in conditional neural audio effects"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "torch>=2.6,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
export = ["onnx>=1.17,<2", "onnxscript>=0.3,<1", "onnxruntime>=1.20,<2"]

[project.scripts]
neural-fx = "neural_fx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
