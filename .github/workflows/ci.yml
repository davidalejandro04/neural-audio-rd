name: research-checks
on: [push, pull_request]
jobs:
  native-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[dev,export]"
      - run: python -m neural_fx native-build
      - run: python -m pytest -q
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[dev,export]"
      - run: python -m pytest -q
      - run: python -m neural_fx run --config configs/smoke.json --output runs/ci --export
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experiment-evidence
          path: runs/ci
